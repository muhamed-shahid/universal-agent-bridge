name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, session tokens, private code or personal paths. For security problems use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UAB version
      description: Output of `uab --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Node.js version
      placeholder: Windows 11, Node 22.14
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options: [Not agent-related, Kiro CLI, Claude Code, OpenCode, Codex CLI]
  - type: input
    id: agent-version
    attributes:
      label: Agent CLI version
      description: From `uab agents status`
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error code and message, `uab agents status`, redacted `uab task logs <id>`.
      render: text
